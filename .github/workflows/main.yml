
name: Build School Management System APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --project-name school_management_system --org com.ilyasmobile --platforms=android .

      - name: Set permanent Play Store application ID
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.ilyasmobile.schoolmanagementsystem"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.schoolmanagementsystem'/" android/app/build.gradle
          else
            echo "Android Gradle file not found"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing GitHub signing secrets."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              p = kts
              text = p.read_text()

              imports = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
              )

              if "import java.util.Properties" not in text:
                  text = imports + text

              if "keystoreProperties" not in text:
                  plugin_match = re.search(r"plugins\s*\{.*?\}", text, re.S)
                  if not plugin_match:
                      raise SystemExit("Could not find plugins block")

                  setup = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
                  text = text[:plugin_match.end()] + "\n" + setup + text[plugin_match.end():]

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """

              if 'create("release")' not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Could not find buildTypes block")
                  text = text.replace(
                      "    buildTypes {",
                      signing + "\n    buildTypes {",
                      1
                  )

              if 'signingConfigs.getByName("debug")' in text:
                  text = text.replace(
                      'signingConfigs.getByName("debug")',
                      'signingConfigs.getByName("release")'
                  )
              elif 'signingConfigs.getByName("release")' not in text:
                  text = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            signingConfig = signingConfigs.getByName("release")',
                      text,
                      count=1
                  )

              p.write_text(text)

          elif groovy.exists():
              p = groovy
              text = p.read_text()

              if "keystoreProperties" not in text:
                  plugin_match = re.search(r"plugins\s*\{.*?\}", text, re.S)
                  if not plugin_match:
                      raise SystemExit("Could not find plugins block")

                  setup = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  imports = (
                      "import java.util.Properties\n"
                      "import java.io.FileInputStream\n\n"
                  )
                  text = imports + text
                  plugin_match = re.search(r"plugins\s*\{.*?\}", text, re.S)
                  text = text[:plugin_match.end()] + "\n" + setup + text[plugin_match.end():]

              signing = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          """

              if "signingConfigs {" not in text:
                  if "    buildTypes {" not in text:
                      raise SystemExit("Could not find buildTypes block")
                  text = text.replace(
                      "    buildTypes {",
                      signing + "\n    buildTypes {",
                      1
                  )

              if "signingConfig signingConfigs.debug" in text:
                  text = text.replace(
                      "signingConfig signingConfigs.debug",
                      "signingConfig signingConfigs.release"
                  )
              elif "signingConfig signingConfigs.release" not in text:
                  text = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            signingConfig signingConfigs.release',
                      text,
                      count=1
                  )

              p.write_text(text)

          else:
              raise SystemExit("Android app Gradle file not found")

          print("Release signing configuration completed.")
          PY

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease -x lintVitalAnalyzeRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
