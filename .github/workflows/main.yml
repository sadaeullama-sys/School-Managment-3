
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -x lint \
            -x lintRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Build signed Play Store AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -x lint \
            -x lintRelease \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease

      - name: Verify release files
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-management-system-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
